[project]
name = "isling-model-mcmc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.16.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pytest>=9.1.1",
    "torch>=2.5.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
